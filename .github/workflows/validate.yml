name: Validate source and fixtures
on:
  push:
    branches: [main]
  pull_request:
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Blender script Python syntax
        run: python -m py_compile blender/scripts/*.py tests/validate_story_scene.py
      - name: Validate sample GeoJSON
        run: python tests/validate_fixture.py
      - name: Test geographic story configuration
        run: python -m unittest discover -s tests -p "test_*.py"
  native-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download Blender 5.3
        run: |
          cd "$RUNNER_TEMP"
          archive=blender-5.3.0-linux-x64.tar.xz
          base=https://download.blender.org/release/Blender5.3
          curl --fail --location --retry 2 --output "$archive" "$base/$archive"
          curl --fail --location --retry 2 --output blender-sha256 "$base/blender-5.3.0.sha256"
          grep -F "$archive" blender-sha256 | sha256sum --check --strict -
          tar -xf "$archive"
          echo "$RUNNER_TEMP/blender-5.3.0-linux-x64" >> "$GITHUB_PATH"
      - name: Build and validate the five-step fixture
        run: |
          blender --background --factory-startup --python-exit-code 1 --python blender/scripts/build_story.py -- --config examples/illustrative-story.json --format portrait --output "${RUNNER_TEMP}/story.blend"
          blender --background "${RUNNER_TEMP}/story.blend" --python-exit-code 1 --python tests/validate_story_scene.py -- --config examples/illustrative-story.json --format portrait
