name: Validate source and fixtures
on:
  push:
    branches: [main]
  pull_request:
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Blender script Python syntax
        run: python -m py_compile blender/scripts/*.py tests/validate_story_scene.py
      - name: Validate sample GeoJSON
        run: python tests/validate_fixture.py
      - name: Test geographic story configuration
        run: python -m unittest discover -s tests -p "test_*.py"
